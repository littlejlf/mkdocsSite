repo_url: https://github.com/littlejlf/mkdocsSite
site_name:  blog from lf

theme:
  name: material
  custom_dir: overrides
  language: 'zh'       # 使用中文
  icon:
    logo: material/notebook-outline
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
  font: false        

plugins:
  - glightbox
  - search:
      lang: [en, ja]  # 多语言搜索

hooks:
  - hooks/generate_index_list.py

markdown_extensions:
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: "#"
      baselevel: 1
      separator: "_"
  - footnotes
  - admonition
  - pymdownx.details
  - attr_list 
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true

